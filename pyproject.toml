[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-honeypot"
version = "0.1.0"
description = "SSH honeypot whose shell is simulated by an LLM (ChatGPT, Claude or OpenRouter)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.14",
    "openai>=1.40",
    "anthropic>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
llm-honeypot = "honeypot.__main__:main"

[tool.setuptools.packages.find]
include = ["honeypot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
